# Runs the app behind one port. Settings are read from .env (see .env.example).
# Start with ./start.sh, which also prints the addresses to open.
#
#   browser -> proxy (port 8067) -> /api/...  -> api
#                                -> anything else -> client
#
# Only the proxy is reachable from the network; the API and client are not.
services:
  proxy:
    image: caddy:2.10-alpine
    ports:
      - "${PORT:-8067}:80"
    volumes:
      - ./proxy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - api
      - client
    restart: unless-stopped

  api:
    build: ./server
    environment:
      Jwt__Secret: ${JWT_SECRET:?Set JWT_SECRET in .env (at least 32 characters)}
      Admin__Username: ${ADMIN_USERNAME:-admin}
      Admin__Email: ${ADMIN_EMAIL:-admin@example.com}
      Admin__Password: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env (at least 12 characters)}
      Seed__Enabled: ${SEED_SAMPLE_USERS:-false}
      # Use the visitor's IP from the proxy, so the login rate limit is per visitor.
      # Safe because only the proxy can reach the API.
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
    volumes:
      - api-data:/data
    restart: unless-stopped

  client:
    build: ./client
    depends_on:
      - api
    restart: unless-stopped

volumes:
  api-data:
